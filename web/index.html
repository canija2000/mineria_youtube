<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --panel: #101318;
    --panel-2: #161B22;
    --line: #222730;
    --line-strong: #303744;
    --text: #ECEEEF;
    --muted: #848D9A;
    --cyan: #4DA3FF;
    --amber: #E2A336;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    color: var(--text);
  }
  .brand i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    display: inline-block;
  }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; max-width: 820px; }
  .seg {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px;
  }
  .seg button {
    background: none;
    border: 0;
    color: var(--muted);
    font: 500 12.5px 'IBM Plex Sans';
    padding: 5px 11px;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  .field { flex: 1; position: relative; display: flex; align-items: center; gap: 6px; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font: 13.5px 'IBM Plex Sans';
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field input.filled, .field.dragover input { border-color: var(--cyan); }
  .field input::placeholder { color: #555E6B; }
  .upload-btn {
    display: none;
    align-items: center;
    gap: 5px;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    color: var(--text);
    border-radius: 4px;
    font: 500 12px 'IBM Plex Sans';
    padding: 8px 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .upload-btn:hover { border-color: var(--cyan); }
  .upload-btn.visible { display: inline-flex; }
  .go {
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
    border-radius: 4px;
    font: 600 12.5px 'IBM Plex Sans';
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .go:hover { opacity: 0.9; }
  .meta {
    margin-left: auto;
    color: var(--muted);
    font: 11.5px 'JetBrains Mono';
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  main { position: relative; display: grid; grid-template-columns: 244px 1fr; min-height: 0; }
  main.with-right { grid-template-columns: 244px 1fr 424px; }
  aside.left {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 16px 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  aside.right {
    background: #0C0E12;
    border-left: 1px solid var(--line);
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 11px;
    overflow-y: auto;
    max-height: calc(100vh - 56px);
  }
  main.with-right aside.right { display: flex; }
  aside.right > * { flex-shrink: 0; }
  aside.right::-webkit-scrollbar { width: 5px; }
  aside.right::-webkit-scrollbar-track { background: #0C0E12; }
  aside.right::-webkit-scrollbar-thumb { background: var(--line); }
  aside.right::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Tarjetas modulares del panel derecho (3 componentes separados) */
  .panel-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 14px 15px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .card-divider {
    height: 1px;
    background: var(--line);
    margin: 2px 0;
  }

  h4 {
    font: 600 10px 'JetBrains Mono';
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .proj { display: flex; flex-direction: column; gap: 4px; }
  .proj label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    padding: 4px 6px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .proj label:hover:not(.disabled) { background: var(--panel-2); color: var(--text); }
  .proj label.on { color: var(--text); background: var(--panel-2); }
  .proj label.disabled { opacity: 0.42; cursor: not-allowed; }
  .proj label span { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #454E5C; flex: none; }
  .proj label.on span { border-color: var(--cyan); background: radial-gradient(var(--cyan) 38%, transparent 44%); }
  .proj label small { margin-left: auto; font: 10px 'JetBrains Mono'; color: var(--muted); }
  .legend { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .legend div {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.12s, opacity 0.12s;
  }
  .legend div:hover { background: var(--panel-2); }
  .legend div.dim { opacity: 0.32; }
  .legend div.active { background: var(--panel-2); outline: 1px solid var(--line-strong); }
  .legend b { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .legend em { margin-left: auto; font: normal 11.5px 'JetBrains Mono'; font-variant-numeric: tabular-nums; color: var(--muted); }
  #view { position: relative; min-width: 0; overflow: hidden; }
  canvas { display: block; }
  .hint { position: absolute; left: 16px; bottom: 14px; color: var(--muted); font: 11.5px 'JetBrains Mono'; pointer-events: none; }
  .tip {
    position: absolute;
    pointer-events: none;
    background: rgba(16, 19, 24, 0.96);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12.5px;
    max-width: 280px;
    display: none;
    z-index: 10;
  }
  .tip small { display: block; color: var(--muted); font: 11px 'JetBrains Mono'; margin-top: 3px; }
  #landmarks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .landmark {
    position: absolute;
    transform: translate(-50%, -100%);
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(16, 19, 24, 0.92);
    border: 1px solid var(--cyan);
    color: var(--text);
    font: 500 11px 'JetBrains Mono';
    padding: 3px 7px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }
  .landmark::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid var(--cyan);
  }
  .landmark:hover { background: var(--panel-2); }
  .landmark button {
    background: none;
    border: 0;
    color: var(--muted);
    font: 11px 'JetBrains Mono';
    cursor: pointer;
    padding: 0 1px;
  }
  .landmark button:hover { color: var(--text); }
  .loading {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(11, 13, 16, 0.78);
    z-index: 20;
  }
  .loading.on { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 24px 26px; width: 440px; }
  .card h3 { font: 600 19px 'Newsreader', Georgia, serif; margin-bottom: 4px; }
  .card p.sub { color: var(--muted); font: 12px 'JetBrains Mono'; margin-bottom: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .steps li { display: flex; align-items: center; gap: 10px; color: #555E6B; }
  .steps li.done { color: var(--text); }
  .steps li.now { color: var(--text); font-weight: 500; }
  .steps li i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #353C47; flex: none; }
  .steps li.done i { border-color: var(--cyan); background: var(--cyan); }
  .steps li.now i { border-color: var(--cyan); border-right-color: transparent; animation: spin .9s linear infinite; }
  .steps li code { margin-left: auto; font: 11px 'JetBrains Mono'; color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { height: 3px; background: var(--bg); margin-top: 18px; overflow: hidden; }
  .bar div { height: 100%; width: 62%; background: var(--cyan); }

  /* Componente 1: Video, Metadatos y Extracto */
  .vid { display: flex; flex-direction: column; gap: 9px; }
  .vid a.vid-thumb-link {
    position: relative;
    display: block;
    width: 100%;
    border-radius: 4px;
    border: 1px solid var(--line);
    overflow: hidden;
    text-decoration: none;
    aspect-ratio: 16/9;
    background: var(--bg);
  }
  .vid a.vid-thumb-link img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vid a.vid-thumb-link:hover .play-overlay { opacity: 1; }
  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 13, 16, 0.58);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    color: var(--text);
    font: 500 12px 'JetBrains Mono';
    gap: 6px;
  }
  .vid a.title-link {
    color: var(--text);
    text-decoration: none;
    font: 500 17px/1.3 'Newsreader', Georgia, serif;
    display: inline-block;
  }
  .vid a.title-link:hover { color: var(--cyan); }
  .channel-line { font-size: 12.5px; color: var(--muted); }
  .channel-line strong { color: var(--text); font-weight: 500; }

  .meta-strip {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 9px 0;
    gap: 8px 12px;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }
  .meta-item svg {
    width: 13.5px;
    height: 13.5px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }
  .meta-item b {
    color: var(--text);
    font: 500 12px 'JetBrains Mono';
    font-variant-numeric: tabular-nums;
  }

  .desc-box {
    font-size: 12px;
    line-height: 1.48;
    color: var(--muted);
    max-height: 78px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .desc-box::-webkit-scrollbar { width: 3px; }
  .desc-box::-webkit-scrollbar-thumb { background: var(--line); }

  /* Componente 2: Clasificación y Conceptos Zero-Shot */
  .cat-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .cat-primary {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); display: inline-block; }
  .cat-method { font: 11px 'JetBrains Mono'; color: var(--muted); }
  .knn-list { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .knn-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 72px 36px;
    gap: 8px;
    align-items: center;
    font-size: 11.5px;
    color: var(--muted);
  }
  .knn-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .knn-bar { height: 3px; background: var(--bg); overflow: hidden; }
  .knn-bar i { display: block; height: 100%; background: var(--cyan); }
  .knn-row code { font: 11px 'JetBrains Mono'; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }

  .tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-chip {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 7px;
    font-size: 11.5px;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.12s, background 0.12s;
  }
  .tag-chip:hover { border-color: var(--cyan); background: var(--panel-2); }
  .tag-chip small { font: 500 10.5px 'JetBrains Mono'; font-variant-numeric: tabular-nums; }

  /* Componente 3: Relaciones en el espacio y Heatmap de coseno */
  .heat-legend {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 7px 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: 10px 'JetBrains Mono';
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .heat-legend span {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
  }
  .heat-legend i {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    display: block;
  }
  .nb-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    padding: 2px;
  }
  .nb-tabs button {
    background: none;
    border: 0;
    color: var(--muted);
    font: 500 12px 'IBM Plex Sans';
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .nb-tabs button:hover { color: var(--text); }
  .nb-tabs button.on-near { background: var(--panel-2); color: var(--text); }
  .nb-tabs button.on-far { background: var(--panel-2); color: var(--amber); }
  .nb-subhint {
    font: 11px 'JetBrains Mono';
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nb { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .nb-card {
    display: grid;
    grid-template-columns: 72px 1fr auto;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    line-height: 1.3;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .nb-card:last-child { border-bottom: 0; padding-bottom: 2px; }
  .nb-card img {
    width: 72px;
    height: 41px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--bg);
    display: block;
  }
  .nb-info { display: flex; flex-direction: column; gap: 2.5px; min-width: 0; }
  .nb-title {
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }
  .nb-title:hover { color: var(--cyan); }
  .nb-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nb-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .sim-badge {
    font: 500 10.5px 'JetBrains Mono';
    font-variant-numeric: tabular-nums;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .nb-btn-row { display: flex; gap: 4px; }
  .btn-action {
    background: none;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
    padding: 2.5px 6px;
    font: 11px 'IBM Plex Sans';
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: border-color 0.12s, color 0.12s, background 0.12s;
  }
  .btn-action:hover { border-color: var(--line-strong); color: var(--text); background: var(--panel-2); }
  .btn-action.active { border-color: var(--amber); color: var(--amber); background: rgba(226, 163, 54, 0.1); }

  .bars { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; }
  .bars div { display: grid; grid-template-columns: 1fr 110px 28px; gap: 8px; align-items: center; }
  .bars span { height: 4px; background: var(--cyan); }
  .bars code { font: 11.5px 'JetBrains Mono'; color: var(--muted); text-align: right; }
  .timeline { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(16, 19, 24, .97); border-top: 1px solid var(--line); padding: 14px 18px 16px; display: none; }
  .timeline.on { display: block; }
  .tl-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .tl-head small { color: var(--muted); font-size: 12px; }
  .track { position: relative; height: 2px; background: var(--line); margin: 0 0 14px; }
  .track b { position: absolute; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); transform: translateX(-50%); }
  .frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .frame { display: grid; grid-template-columns: 132px 1fr; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 10px; }
  .frame img { width: 132px; height: 74px; object-fit: cover; border-radius: 3px; }
  .frame code { font: 11.5px 'JetBrains Mono'; color: var(--cyan); }
  .words { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; font-size: 12px; }
  .words div { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
  .words em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .words span { height: 3px; background: var(--cyan); }
  .tag { position: absolute; right: 14px; top: 12px; font: 11px 'JetBrains Mono'; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>Mapa de YouTube</div>
    <div class="search">
      <div class="seg">
        <button id="m-video" class="on">Video</button>
        <button id="m-image">Imagen</button>
        <button id="m-concept">Concepto</button>
        <button id="m-profile">Perfil</button>
      </div>
      <div class="field" id="search-field">
        <input id="q" placeholder="Pega el link o ID de un video de YouTube…">
        <input type="file" id="img-file" accept="image/jpeg,image/png,image/webp" hidden>
        <button type="button" class="upload-btn" id="btn-upload" title="Elegir o arrastrar archivo de imagen (no se guarda en BDD)">Subir archivo…</button>
      </div>
      <button class="go" id="go">Ubicar en el mapa</button>
    </div>
    <div class="meta">cargando mapa…</div>
  </header>
  <main id="main">
    <aside class="left">
      <div><h4>Representación</h4></div>
      <div class="proj">
        <label id="rep-text" class="on" onclick="switchRepresentation('text')"><span></span>Texto<small id="count-text">—</small></label>
        <label id="rep-image" onclick="switchRepresentation('image')"><span></span>Imagen<small id="count-image">—</small></label>
        <label class="disabled" title="Próximamente"><span></span>Fusión temprana</label>
        <label class="disabled" title="Próximamente"><span></span>Fusión tardía</label>
      </div>
      <div><h4>Categorías</h4></div>
      <div class="legend" id="legend"></div>
    </aside>
    <div id="view">
      <div id="landmarks"></div>
      <div class="tip" id="tip"></div>
      <div class="hint">Arrastra para rotar · rueda para zoom · pasa el mouse sobre un punto</div>
      <div class="tag">mapa base</div>
      <div class="loading" id="loading"><div class="card" id="loadcard"></div></div>
      <div class="timeline" id="timeline"></div>
    </div>
    <aside class="right" id="right"></aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const API_BASE = (window.location.origin === 'null' || window.location.protocol === 'file:') ? 'http://127.0.0.1:8000' : '';
// D se llena con la respuesta de /map (applyMapPayload)
let D = { cats: [], ids: [], titles: [], cat: [], pts: [], info: {} };
let currentRepresentation = 'text';
const PALETTE = ['#4DA3FF', '#E2A336', '#D96B62', '#68B87A', '#9D7FE8', '#D97EB0', '#54B8B1', '#E08258', '#869CEB', '#C4BE62'];

// Escala de color (heatmap) para similitud coseno s in [-1, 1] y distancia coseno d = 1 - s
function getHeatmapInfo(similarity, distance3d, isFar) {
  let sim = similarity;
  if (sim == null && distance3d != null) {
    sim = Math.max(0.50, Math.min(0.95, 0.95 - (distance3d / 12) * 0.40));
  }
  if (sim == null) {
    sim = isFar ? 0.58 : 0.85;
  }
  const dCos = Math.max(0, 1 - sim);
  let fg, bg, border, hex;
  if (sim > 0.90) {
    fg = '#4ADE80'; bg = 'rgba(74, 222, 128, 0.12)'; border = 'rgba(74, 222, 128, 0.35)'; hex = 0x4ADE80;
  } else if (sim > 0.80) {
    fg = '#2EA043'; bg = 'rgba(46, 160, 67, 0.14)'; border = 'rgba(46, 160, 67, 0.38)'; hex = 0x2EA043;
  } else if (sim > 0.70) {
    fg = '#58A6FF'; bg = 'rgba(88, 166, 255, 0.12)'; border = 'rgba(88, 166, 255, 0.35)'; hex = 0x58A6FF;
  } else if (sim > 0.60) {
    fg = '#E2A336'; bg = 'rgba(226, 163, 54, 0.12)'; border = 'rgba(226, 163, 54, 0.35)'; hex = 0xE2A336;
  } else {
    fg = '#E5534B'; bg = 'rgba(229, 83, 75, 0.12)'; border = 'rgba(229, 83, 75, 0.35)'; hex = 0xE5534B;
  }
  const label = similarity != null
    ? `sim ${sim.toFixed(2)} · d ${dCos.toFixed(2)}`
    : `~sim ${sim.toFixed(2)} · d ${dCos.toFixed(2)}`;
  return { sim, dCos, fg, bg, border, hex, label };
}

function applyCategoryFilter(catIdx) {
  if (catIdx !== null && activeCatFilter === catIdx) {
    activeCatFilter = null;
  } else {
    activeCatFilter = catIdx;
  }
  if (base && base.geometry && base.geometry.attributes.color) {

    const dimColor = new THREE.Color('#181D24');
    for (let i = 0; i < P.length; i++) {

      colAttr.setXYZ(i, c.r, c.g, c.b);

function disc() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.beginPath(); g.arc(32, 32, 26, 0, 7); g.fill();
  return new THREE.CanvasTexture(c);
}
function ring() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath(); g.arc(64, 64, 54, 0, 7); g.stroke();
  return new THREE.CanvasTexture(c);
}
const DISC = disc(), RING = ring();

function cloud(ids, colors, size, opacity) {
  const g = new THREE.BufferGeometry();
  const arr = new Float32Array(ids.length * 3), col = new Float32Array(ids.length * 3);
  ids.forEach((i, k) => { pos(i).toArray(arr, k * 3); new THREE.Color(colors(i)).toArray(col, k * 3); });
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({ size, map: DISC, vertexColors: true, transparent: true, opacity, alphaTest: 0.02, depthWrite: false });
  return new THREE.Points(g, m);
}

function applyMapPayload(data, rep) {
  const p = data.points;
  const rawCats = (data.verticals || []).slice();
  rawCats.push('(Sin categoría)');
  const rawUnkIdx = rawCats.length - 1;
  const rawCatPerPt = p.vertical.map(v => v < 0 ? rawUnkIdx : v);

  const freq = rawCats.map((name, i) => ({ name, i, count: 0 }));
  rawCatPerPt.forEach(c => { if (freq[c]) freq[c].count++; });
  freq.sort((a, b) => {
    const aUnk = a.name.startsWith('(') ? 1 : 0;
    const bUnk = b.name.startsWith('(') ? 1 : 0;
    if (aUnk !== bUnk) return aUnk - bUnk;
    return b.count - a.count;
  });
  const oldToNew = Object.fromEntries(freq.map((f, newIdx) => [f.i, newIdx]));

  D.cats = freq.map(f => f.name);
  D.ids = p.youtube_id;
  D.titles = p.title;
  D.cat = rawCatPerPt.map(oldIdx => oldToNew[oldIdx] ?? (D.cats.length - 1));
  D.pts = [];
  D.info = D.info || {};
  for (let i = 0; i < p.youtube_id.length; i++) {
    D.pts.push([p.x[i], p.y[i], p.z[i]]);
    const yid = p.youtube_id[i];
    const prev = D.info[yid] || {};
    D.info[yid] = {
      ...prev,
      t: p.title[i] || prev.t,
      ch: p.channel_title[i] || prev.ch,
      c: p.vertical[i] >= 0 ? data.verticals[p.vertical[i]] : '(Sin categoría)',
      zs: (p.pred_names && p.pred_names[i]) ? p.pred_names[i] : prev.zs
    };
  }
  idx = Object.fromEntries(D.ids.map((y, i) => [y, i]));
  P = D.pts;
  mean = [0, 1, 2].map(k => P.reduce((a, pt) => a + pt[k], 0) / P.length);
  rad = Math.max(...P.map(pt => Math.hypot(pt[0] - mean[0], pt[1] - mean[1], pt[2] - mean[2]))) || 1;

  activeCatFilter = null;
  scene.remove(base);
  all = [...P.keys()];
  base = cloud(all, i => colorOf(D.cat[i]), rep === 'image' ? 0.19 : 0.15, 0.85);
  scene.add(base);

  updateLegend();

  const repLabel = rep === 'image' ? 'Imagen (Miniaturas)' : 'Texto';
  const metaTag = document.querySelector('.meta');
  if (metaTag) metaTag.textContent = `${D.ids.length.toLocaleString('es-CL')} videos · ${repLabel} · UMAP 3D`;
  const countEl = document.getElementById(rep === 'image' ? 'count-image' : 'count-text');
  if (countEl) countEl.textContent = D.ids.length.toLocaleString('es-CL');
  const tag = document.querySelector('.tag');
  if (tag) tag.textContent = `${rep === 'image' ? 'espacio visual' : 'espacio textual'} · v${data.map_version}`;
}

async function loadServerMap(rep = 'text') {
  const metaTag = document.querySelector('.meta');
  try {
    const res = await fetch(`${API_BASE}/map?rep=${rep}`);
    if (!res.ok) throw new Error(`el servidor respondió ${res.status}`);
    applyMapPayload(await res.json(), rep);
  } catch (e) {
    if (metaTag) metaTag.textContent = `No se pudo cargar el mapa (${e.message}). ¿Está corriendo el servidor?`;
  }
}

function setCamera(target, dist, az = 0.9, el = 0.35) {
  controls.target.copy(target);
  camera.position.set(target.x + dist * Math.cos(el) * Math.cos(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.sin(az));
  controls.update();
}

// Hitos de conceptos anclados al espacio 3D
let pinnedConcepts = [];

function addPinnedConcept(query, pos3d) {
  const key = query.trim().toLowerCase();
  const existing = pinnedConcepts.find(c => c.key === key);
  if (existing) {
    existing.pos3d = pos3d.clone();
  } else {
    pinnedConcepts.push({ key, query: query.trim(), pos3d: pos3d.clone() });
  }
  renderLandmarksDOM();
}

function removePinnedConcept(key, ev) {
  if (ev) ev.stopPropagation();
  pinnedConcepts = pinnedConcepts.filter(c => c.key !== key);
  renderLandmarksDOM();
}

function renderLandmarksDOM() {
  const container = document.getElementById('landmarks');
  if (!container) return;
  container.innerHTML = pinnedConcepts.map(c => `
    <div class="landmark" data-key="${c.key}" onclick="selectConcept('${c.query.replace(/'/g, "\\'")}')" title="Re-enfocar concepto en el mapa 3D">
      <span>«${c.query}»</span>
      <button onclick="removePinnedConcept('${c.key.replace(/'/g, "\\'")}', event)" title="Quitar etiqueta del mapa">×</button>
    </div>
  `).join('');
  updateLandmarksPositions();
}

function updateLandmarksPositions() {
  if (!pinnedConcepts.length) return;
  const container = document.getElementById('landmarks');
  if (!container) return;
  const r = renderer.domElement.getBoundingClientRect();
  const els = container.querySelectorAll('.landmark');
  els.forEach((el, i) => {
    const item = pinnedConcepts[i];
    if (!item) return;
    const v = item.pos3d.clone().project(camera);
    if (v.z > 1) {
      el.style.display = 'none';
      return;
    }
    const x = (v.x + 1) / 2 * r.width;
    const y = (1 - v.y) / 2 * r.height;
    el.style.display = 'inline-flex';
    el.style.left = `${x}px`;
    el.style.top = `${y - 8}px`;
  });
}

function handleImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (file.size > 10 * 1024 * 1024) {
    alert('La imagen supera el límite de 10 MB.');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImageDataUrl = ev.target.result;
    pendingImageLabel = `[Archivo] ${file.name}`;
    modeInputs.image = pendingImageLabel;
    setMode('image', false);
    runImageSearch({ image_data: pendingImageDataUrl, label: file.name });
  };
  reader.readAsDataURL(file);
}

imgFileInput.addEventListener('change', e => {
  if (e.target.files && e.target.files[0]) {
    handleImageFile(e.target.files[0]);
    e.target.value = '';
  }
});

[searchField, view].forEach(el => {
  el.addEventListener('dragover', e => {
    e.preventDefault();
    searchField.classList.add('dragover');
  });
  el.addEventListener('dragleave', () => searchField.classList.remove('dragover'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    searchField.classList.remove('dragover');
    const dt = e.dataTransfer;
    if (!dt) return;
    if (dt.files && dt.files[0]) {
      handleImageFile(dt.files[0]);
      return;
    }
    // Imagen arrastrada desde otra pestaña (Google Imágenes, una web cualquiera):
    // el navegador no entrega un archivo, solo la URL o el HTML del <img>.
    const dropped = imageFromDrop(dt);
    if (!dropped) {
      alert('No se encontró una imagen en lo que arrastraste.');
      return;
    }
    modeInputs.image = dropped.label;
    setMode('image', false);
    runImageSearch(dropped);
  });
});

function imageFromDrop(dt) {
  const uri = (dt.getData('text/uri-list') || dt.getData('text/plain') || '').split('\n')[0].trim();
  // Google Imágenes enlaza a /imgres?imgurl=<original>: preferimos la imagen original.
  try {
    const original = new URL(uri).searchParams.get('imgurl');
    if (original) return { image_url: original, label: original.split('/').pop().split('?')[0] };
  } catch (_) {}
  // Si no, el src del <img> arrastrado (puede ser http o una miniatura data:image en base64).
  const html = dt.getData('text/html');
  const src = html && new DOMParser().parseFromString(html, 'text/html').querySelector('img')?.getAttribute('src');
  if (src && src.startsWith('data:image/')) return { image_data: src, label: 'Imagen arrastrada' };
  if (src && /^https?:\/\//.test(src)) return { image_url: src, label: src.split('/').pop().split('?')[0] };
  if (/^https?:\/\//.test(uri)) return { image_url: uri, label: uri.split('/').pop().split('?')[0] };
  return null;
}

  const g = new THREE.BufferGeometry().setFromPoints([a, b]);

function computeKnnVotes(vid, neighbors) {
  if (vid && vid.knn_votes && vid.knn_votes.vertical) return vid.knn_votes;
  const counts = {};
  let total = 0;
  (neighbors || []).forEach(nb => {
    const v = nb.vertical;
    if (v && v !== '(Sin categoría)') {
      counts[v] = (counts[v] || 0) + 1;
      total++;
    }
  });
  const breakdown = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([vertical, count]) => ({ vertical, count }));
  return {
    vertical: breakdown.length ? breakdown[0].vertical : null,
    count: breakdown.length ? breakdown[0].count : 0,
    total,
    breakdown
  };
}

// Etiquetas zero-shot: las calcula el servidor (vocabulario YT-8M + folksonomía).
function inferClientZeroShot(item) {
  return (item && item.zero_shot_tags) || [];
}

function renderRelationOverlay(targetPos, list, isFar) {
  if (relationGroup) {
    overlay.remove(relationGroup);
  }
  relationGroup = new THREE.Group();
  relationPoints = null;
  relationIds = [];
  relationPointColors = [];
  const lineOpacity = isFar ? 0.38 : 0.48;
  const positions = [];

  (list || []).forEach(item => {
    if (item.projection) {
      const np = coordToVector3(item.projection);
      const heat = getHeatmapInfo(item.similarity, item.distance_3d, isFar);
      positions.push(np);
      relationIds.push(item.youtube_id);
      relationPointColors.push(new THREE.Color(heat.hex));
      relationGroup.add(line(targetPos, np, heat.hex, lineOpacity));
    }
  });

  if (positions.length > 0) {
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(positions.length * 3);
    const col = new Float32Array(positions.length * 3);
    positions.forEach((p, i) => {
      p.toArray(arr, i * 3);
      relationPointColors[i].toArray(col, i * 3);
    });
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size: 0.34, map: DISC, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false });
    relationPoints = new THREE.Points(g, m);
    relationGroup.add(relationPoints);
  }

  overlay.add(relationGroup);
}

function focusNeighbor(nbId, coords, btnEl) {
  if (!coords || coords.length < 3) return;
  if (focusedNeighborId === nbId) {
    clearFocusRing();
    if (currentTargetPos) {
      setCamera(currentTargetPos, currentRelTab === 'farthest' ? 28 : 16);
    }
    return;
  }
  clearFocusRing();
  const p = coordToVector3(coords);
  setCamera(p, 12);

  // Cambiar el color del propio punto para distinguirlo en clusters densos
  const ringHex = 0xE2A336;
  const idxInRel = relationIds.indexOf(nbId);
  if (idxInRel >= 0 && relationPoints && relationPoints.geometry && relationPoints.geometry.attributes.color) {
    const colAttr = relationPoints.geometry.attributes.color;
    const fc = new THREE.Color(0xFFFFFF);
    colAttr.setXYZ(idxInRel, fc.r, fc.g, fc.b);
    colAttr.needsUpdate = true;
  }

  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([p.x, p.y, p.z]), 3));
  const dm = new THREE.PointsMaterial({ size: 0.42, map: DISC, color: ringHex, transparent: true, opacity: 1, depthTest: false, depthWrite: false });
  focusedNeighborDot = new THREE.Points(dg, dm);
  overlay.add(focusedNeighborDot);

  const r = new THREE.Sprite(new THREE.SpriteMaterial({ map: RING, color: ringHex, depthTest: false }));
  r.position.copy(p);
  r.scale.set(0.86, 0.86, 1);
  overlay.add(r);

  focusedNeighborRing = r;
  focusedNeighborId = nbId;
  if (btnEl) {
    btnEl.classList.add('active');
    btnEl.textContent = 'Desmarcar ✕';
  }
}

async function runConcept(query) {
  clearResult();
  loading('concept', 0);
  let step = 0;
  const timer = setInterval(() => {
    if (step < 3) {
      step++;
      loading('concept', step);
    }
  }, 500);

  try {
    const res = await fetch(API_BASE + '/concepts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ concept: query })
    });
    clearInterval(timer);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error del servidor (${res.status})`);
    }
    const data = await res.json();
    document.getElementById('loading').classList.remove('on');
    const targetPos = showConceptResult(data);
    setCamera(targetPos, 18);
  } catch (err) {
    clearInterval(timer);
    document.getElementById('loading').classList.remove('on');
    alert('No se pudo ubicar el concepto:\n' + err.message);
  }
}

async function runRealVideo(query) {
  clearResult();
  loading('video', 0);
  const sub = document.getElementById('loadcard').querySelector('p.sub');
  if (sub) sub.textContent = query;

  let step = 0;

      step++;
      loading('video', step);
      const s = document.getElementById('loadcard').querySelector('p.sub');
      if (s) s.textContent = query;
    }
  }, 900);

  try {
    const res = await fetch(API_BASE + '/videos', {
      method: 'POST',

      body: JSON.stringify({ video: query, representation: currentRepresentation })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));

      <div class="cat-header">
        <h4>2 · Clasificación visual (kNN)</h4>
        <span class="cat-method">${knn.vertical ? `kNN · ${knn.count}/${knn.total} vecinos` : ''}</span>
      </div>
      <div class="cat-primary">
        <i class="cat-dot"></i>
        <span>${primaryVert}</span>
      </div>
      ${knn.breakdown && knn.breakdown.length ? `
        <div class="knn-list">
          ${knn.breakdown.slice(0, 4).map(b => {
            const pct = Math.round((b.count / (knn.total || 1)) * 100);
            return `
              <div class="knn-row">
                <span>${b.vertical}</span>
                <div class="knn-bar"><i style="width:${pct}%"></i></div>
                <code>${b.count}/${knn.total}</code>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
      ${zsTags && zsTags.length ? `
        <div class="card-divider"></div>
        <div class="cat-header">
          <h4>Conceptos visuales (Zero-Shot)</h4>
          <span class="cat-method">clic para mapear</span>
        </div>
        <div class="tags-wrap">
          ${zsTags.map(z => {
            const h = getHeatmapInfo(z.score, null, false);
            return `
              <button class="tag-chip" onclick="selectConcept('${String(z.tag).replace(/'/g, "\\'")}')">
                <span>${z.tag}</span>
                ${z.score != null ? `<small style="color:${h.fg}">${z.score.toFixed(2)}</small>` : ''}
              </button>
            `;
          }).join('')}
        </div>
      ` : ''}
    </section>

    <section class="panel-card">
      <div class="cat-header">
        <h4>3 · Relaciones en el espacio visual</h4>
      </div>
      ${HEATMAP_LEGEND_HTML}
      <div class="nb-tabs">
        <button id="tab-near" class="on-near" onclick="switchNeighborTab('nearest')">Más cercanos (${nearCount})</button>
        <button id="tab-far" onclick="switchNeighborTab('farthest')">Más lejanos (${farCount})</button>
      </div>
      <div class="nb-subhint" id="nb-subhint">
        <span>Miniaturas más similares</span><span>d = 1 − sim</span>
      </div>
      <div class="nb" id="nb-list">
        ${renderNeighborCards(data.neighbors || [], false)}
      </div>
    </section>
  `;
  document.getElementById('main').classList.add('with-right');
  resize();
  return targetPos;
}

async function runImageSearch(payload) {
  if (currentRepresentation !== 'image') {
    await switchRepresentation('image');
  }
  clearResult();
  loading('image', 0);
  let step = 0;
  const timer = setInterval(() => {
    if (step < 3) {
      step++;
      loading('image', step);
    }
  }, 550);

  try {
    const res = await fetch(API_BASE + '/images', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    clearInterval(timer);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error del servidor (${res.status})`);
    }
    const data = await res.json();
    document.getElementById('loading').classList.remove('on');
    const targetPos = showExternalImageResult(data);
    setCamera(targetPos, 16);
  } catch (err) {
    clearInterval(timer);
    document.getElementById('loading').classList.remove('on');
    alert('No se pudo procesar la imagen:\n' + err.message);
  }
}

function showRealProfileResult(data) {
  clearResult();
  base.material.opacity = 0.25;

  const targetCoords = data.projection;
  const targetPos = coordToVector3(targetCoords);
  const prof = data.profile || {};

  currentVideoData = data;
  currentTargetPos = targetPos;
  currentRelTab = 'nearest';
  data._farthestList = data.farthest || [];

  renderRelationOverlay(targetPos, data.neighbors || [], false);

  // Nube de los videos del propio perfil
  if (data.profile_videos && data.profile_videos.length) {
    const pPts = data.profile_videos.map(v => coordToVector3(v.projection));
    pPts.forEach(p => overlay.add(line(targetPos, p, 0x4DA3FF, 0.22)));
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(pPts.length * 3);
    pPts.forEach((p, i) => p.toArray(arr, i * 3));
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const m = new THREE.PointsMaterial({ size: 0.34, map: DISC, color: 0x4DA3FF, transparent: true, opacity: 0.9, depthWrite: false });
    overlay.add(new THREE.Points(g, m));
  }

  const r = new THREE.Sprite(new THREE.SpriteMaterial({ map: RING, color: 0x4DA3FF, depthTest: false }));
  r.position.copy(targetPos);
  r.scale.set(1.4, 1.4, 1);
  overlay.add(r);

  const knn = computeKnnVotes(prof, data.neighbors || []);
  const zsTags = inferClientZeroShot(prof, data.neighbors || []);
  const nVids = prof.analyzed_videos || (data.profile_videos || []).length || 1;
  const nearCount = (data.neighbors || []).length;
  const farCount = (data._farthestList || []).length;

  document.getElementById('right').innerHTML = `
    <section class="panel-card">
      <div class="vid">
        <div class="cat-header">
          <h4>1 · Perfil / Canal analizado</h4>
          <span class="cat-method">${nVids} videos</span>
        </div>
        <div style="font:600 20px/1.25 'Newsreader', Georgia, serif;color:var(--text)">${prof.title || prof.query || 'Perfil'}</div>
        ${prof.subscriber_count != null ? `<div class="channel-line">Suscriptores: <strong>${prof.subscriber_count.toLocaleString('es-CL')}</strong> · Cohesión: <strong>${(prof.cohesion || 0.82).toFixed(2)}</strong></div>` : ''}
        ${prof.description ? `<div class="desc-box">${prof.description}</div>` : ''}
      </div>
    </section>

    <section class="panel-card">
      <div class="cat-header">
        <h4>2 · Distribución de tu burbuja</h4>
        <span class="cat-method">${(knn.breakdown || []).length} de ${prof.total_categories || D.cats.length} categorías</span>
      </div>
      ${knn.breakdown && knn.breakdown.length ? `
        <div class="knn-list">
          ${knn.breakdown.slice(0, 6).map(b => {
            const pct = Math.round((b.count / (knn.total || nVids)) * 100);
            return `
              <div class="knn-row">
                <span>${b.vertical}</span>
                <div class="knn-bar"><i style="width:${pct}%"></i></div>
                <code>${b.count}/${knn.total || nVids}</code>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
      ${zsTags && zsTags.length ? `
        <div class="card-divider"></div>
        <div class="cat-header">
          <h4>Conceptos dominantes (Zero-Shot)</h4>
          <span class="cat-method">clic para mapear</span>
        </div>
        <div class="tags-wrap">
          ${zsTags.map(z => {
            const h = getHeatmapInfo(z.score, null, false);
            return `
              <button class="tag-chip" onclick="selectConcept('${String(z.tag).replace(/'/g, "\\'")}')">
                <span>${z.tag}</span>
                ${z.score != null ? `<small style="color:${h.fg}">${z.score.toFixed(2)}</small>` : ''}
              </button>
            `;
          }).join('')}
        </div>
      ` : ''}
    </section>

    <section class="panel-card">
      <div class="cat-header">
        <h4>3 · Videos afines vs. Fuera de tu burbuja</h4>
      </div>
      ${HEATMAP_LEGEND_HTML}
      <div class="nb-tabs">
        <button id="tab-near" class="on-near" onclick="switchNeighborTab('nearest')">En tu burbuja (${nearCount})</button>
        <button id="tab-far" onclick="switchNeighborTab('farthest')">Fuera de burbuja (${farCount})</button>
      </div>
      <div class="nb-subhint" id="nb-subhint">
        <span>Mayor afinidad con el centroide del perfil</span><span>d = 1 − sim</span>
      </div>
      <div class="nb" id="nb-list">
        ${renderNeighborCards(data.neighbors || [], false)}
      </div>
    </section>
  `;
  document.getElementById('main').classList.add('with-right');
  resize();
  return targetPos;
}

async function runRealProfile(query) {
  clearResult();
  loading('profile', 0);
  let step = 0;
  const timer = setInterval(() => {
    if (step < 3) {
      step++;
      loading('profile', step);
    }
  }, 600);

  try {
    const res = await fetch(API_BASE + '/profiles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: query })
    });
    clearInterval(timer);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error del servidor (${res.status})`);
    }
    const data = await res.json();
    document.getElementById('loading').classList.remove('on');
    const targetPos = showRealProfileResult(data);
    setCamera(targetPos, 24);
  } catch (err) {
    clearInterval(timer);
    document.getElementById('loading').classList.remove('on');
    alert('No se pudo analizar el perfil:\n' + err.message);
  }
}

function isLikelyVideoInput(val) {
  const s = val.trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return true;
  if (/youtu\.be\/|youtube\.com\//i.test(s)) return true;
  return false;
}

function isLikelyImageUrl(val) {
  const s = val.trim();
  if (s.startsWith('data:image/')) return true;
  if (/\.(jpe?g|png|webp|gif|avif)(\?.*)?$/i.test(s)) return true;
  if (/i\.ytimg\.com\/|images\.unsplash\.com\/|imgur\.com\/|wikimedia\.org\//i.test(s)) return true;
  return false;
}

function run(m) {
  if (m === 'profile') {
    const query = q.value.trim();
    if (!query) return;
    modeInputs.profile = query;
    q.classList.add('filled');
    runRealProfile(query);
    return;
  }

  if (m === 'image') {
    if (pendingImageDataUrl && q.value === pendingImageLabel) {
      runImageSearch({ image_data: pendingImageDataUrl, label: pendingImageLabel });
      return;
    }
    const query = q.value.trim();
    if (!query) return;
    modeInputs.image = query;
    q.classList.add('filled');
    runImageSearch({ image_url: query, label: query });
    return;
  }

  if (m === 'concept') {
    const query = q.value.trim() || 'symphony';
    q.value = query;
    modeInputs.concept = query;
    q.classList.add('filled');
    runConcept(query);
    return;
  }

  const query = q.value.trim();
  if (!query) return;
  q.value = query;
  modeInputs.video = query;
  q.classList.add('filled');
  if (isLikelyImageUrl(query)) {
    modeInputs.image = query;
    setMode('image', false);
    runImageSearch({ image_url: query, label: query });
    return;
  }
  if (!isLikelyVideoInput(query)) {
    modeInputs.concept = query;
    setMode('concept', false);
    runConcept(query);
    return;
  }
  runRealVideo(query);
}

function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  updateLandmarksPositions();
}
function start() {
  resize();
  clearResult(); document.getElementById('loading').classList.remove('on'); tip.style.display = 'none';
  setMode('video', false);
  setCamera(new THREE.Vector3(), 30);
  controls.autoRotate = false;
}
window.addEventListener('resize', resize);
start();
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  updateLandmarksPositions();
})();
</script>
